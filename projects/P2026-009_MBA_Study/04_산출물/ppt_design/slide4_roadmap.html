<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: 'Malgun Gothic', Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { margin: 22pt 36pt 0 36pt; }
.kicker { color: #2E74B5; font-size: 9pt; font-weight: bold; letter-spacing: 1.5pt; margin: 0 0 5pt 0; }
.headline { color: #16324F; font-size: 16.5pt; font-weight: bold; margin: 0; line-height: 1.3; }
.hrule { height: 1.5pt; background: #16324F; margin: 9pt 36pt 0 36pt; }
.content { margin: 11pt 36pt 0 36pt; display: flex; flex-direction: column; }
.tbl { width: 648pt; height: 232pt; }
.legend { margin: 8pt 0 0 0; display: flex; }
.lg { display: flex; margin-right: 18pt; }
.sw { width: 10pt; height: 10pt; margin: 1pt 5pt 0 0; }
.sw-e { background: #2E74B5; }
.sw-i { background: #16324F; }
.sw-v { background: #1E8449; }
.lg p { margin: 0; font-size: 8.5pt; color: #5B6770; }
.footer { margin: auto 36pt 10pt 36pt; display: flex; }
.footer p { font-size: 7.5pt; color: #9AA5AF; margin: 0; }
.footer .pg { margin-left: auto; }
</style>
</head>
<body>
  <div class="header">
    <p class="kicker">PART 4 · 개선과제 — 실행 로드맵</p>
    <p class="headline">1년 안에 평가를 바꾸고, 3년에 걸쳐 보상과 육성을 같은 방향으로 정렬한다</p>
  </div>
  <div class="hrule"></div>
  <div class="content">
    <div id="gantt" class="placeholder tbl"></div>
    <div class="legend">
      <div class="lg"><div class="sw sw-e"></div><p><b>E</b> — 노력→성과 복원 (육성·경력)</p></div>
      <div class="lg"><div class="sw sw-i"></div><p><b>I</b> — 성과→보상 복원 (평가·보상)</p></div>
      <div class="lg"><div class="sw sw-v"></div><p><b>V</b> — 보상→가치 복원 (총보상·유지)</p></div>
      <div class="lg"><div class="sw" style="background:#9AA5AF;"></div><p>기반 (HR 전담·진단)</p></div>
    </div>
  </div>
  <div class="footer">
    <p>설계 원리: 기대이론(Vroom, 1964)의 동기 사슬(E→I→V) 복원 · 점진적 변화(Session 12) · Kotter 8단계 변화관리</p>
    <p class="pg">18</p>
  </div>
</body>
</html>
