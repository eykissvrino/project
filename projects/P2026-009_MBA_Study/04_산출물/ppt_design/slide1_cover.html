<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #16324F; font-family: 'Malgun Gothic', Arial, sans-serif;
  display: flex; flex-direction: column;
}
.top { margin: 48pt 54pt 0 54pt; }
.kicker { color: #7FA7CC; font-size: 11pt; font-weight: bold; letter-spacing: 3pt; margin: 0; }
.mid { margin: 64pt 54pt 0 54pt; }
.rule { width: 44pt; height: 3pt; background: #D9A441; margin: 0 0 18pt 0; }
h1 { color: #FFFFFF; font-size: 38pt; margin: 0 0 14pt 0; font-weight: bold; line-height: 1.25; }
.sub { color: #A8C3DE; font-size: 16.5pt; margin: 0; line-height: 1.4; }
.bottom { margin: auto 54pt 40pt 54pt; display: flex; }
.who p { color: #E8EEF5; font-size: 11.5pt; margin: 0 0 3pt 0; }
.who .dim { color: #7FA7CC; font-size: 10pt; }
.date { margin-left: auto; }
.date p { color: #7FA7CC; font-size: 10.5pt; margin: 0; text-align: right; }
</style>
</head>
<body>
  <div class="top">
    <p class="kicker">2026-1 인적자원관리 · 기말 프로젝트</p>
  </div>
  <div class="mid">
    <div class="rule"></div>
    <h1>전문가가 머무는 회사로</h1>
    <p class="sub">시앤피컨설팅 HR시스템 진단 및 개선과제 도출<br>— 전략적 HRM 관점의 정합성 분석과 동기 사슬의 복원</p>
  </div>
  <div class="bottom">
    <div class="who">
      <p><b>이석주</b></p>
      <p class="dim">KUMBA · 인적자원관리 9512-01 · 정혜정 교수</p>
    </div>
    <div class="date">
      <p>2026. 06. 12</p>
    </div>
  </div>
</body>
</html>
