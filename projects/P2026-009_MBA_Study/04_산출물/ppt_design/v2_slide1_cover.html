<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 842pt; height: 595.5pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: 'Paperlogy 4 Regular', 'Malgun Gothic', sans-serif;
  display: flex; flex-direction: column;
}
.band { height: 7pt; background: #F08000; }
.logo { margin: 34pt 0 0 52pt; }
.mid { margin: 118pt 52pt 0 52pt; }
.kicker { font-family: 'Paperlogy 6 SemiBold', sans-serif; color: #F08000; font-size: 12pt; letter-spacing: 3pt; margin: 0 0 16pt 0; }
.rule { width: 58pt; height: 4pt; background: #F08000; margin: 0 0 22pt 0; }
h1 { font-family: 'Paperlogy 8 ExtraBold', sans-serif; color: #26282B; font-size: 44pt; margin: 0 0 16pt 0; line-height: 1.2; }
.sub { font-family: 'Paperlogy 5 Medium', sans-serif; color: #6B7178; font-size: 17pt; margin: 0; line-height: 1.45; }
.bottom { margin: auto 52pt 36pt 52pt; display: flex; border-top: 1pt solid #E3E6E9; }
.who { margin-top: 14pt; width: 420pt; }
.who p { margin: 0 0 3pt 0; }
.name { font-family: 'Paperlogy 7 Bold', sans-serif; font-size: 13pt; color: #26282B; }
.dim { font-size: 10pt; color: #8B9197; }
.date { margin: 14pt 0 0 auto; }
.date p { font-size: 10.5pt; color: #8B9197; margin: 0; text-align: right; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="logo"><img src="logo_kr.png" style="width: 200pt; height: 36pt;"></div>
  <div class="mid">
    <p class="kicker">2026-1 인적자원관리 · 기말 프로젝트</p>
    <div class="rule"></div>
    <h1>전문가가 머무는 회사로</h1>
    <p class="sub">시앤피컨설팅 HR시스템 진단 및 개선과제 도출<br>전략적 HRM 관점의 정합성 분석과 동기 사슬의 복원</p>
  </div>
  <div class="bottom">
    <div class="who">
      <p class="name">이석주</p>
      <p class="dim">KUMBA · 인적자원관리 9512-01 · 정혜정 교수</p>
    </div>
    <div class="date">
      <p>2026. 06. 12</p>
    </div>
  </div>
</body>
</html>
