<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html { background: #FFFFFF; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      color: #1E293B;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }
    .page { display: flex; flex-direction: column; flex: 1; margin: 24pt 32pt; }
    h1 { margin: 0; font-size: 28pt; line-height: 1.25; color: #1E293B; }
    h2 { margin: 0; font-size: 22pt; line-height: 1.25; color: #1E293B; }
    h3 { margin: 0; font-size: 16pt; line-height: 1.3; color: #1E293B; }
    p { margin: 0; font-size: 12pt; line-height: 1.45; color: #1E293B; }
    .muted { color: #64748B; }
    .lime { color: #BDFF00; }
    .grid-2 { display: flex; gap: 12pt; }
    .grid-3 { display: flex; gap: 10pt; }
    .grid-4 { display: flex; gap: 8pt; }
    .col { display: flex; flex-direction: column; gap: 8pt; flex: 1; min-width: 0; }
    .card {
      background: #F8FAFC;
      border-radius: 8pt;
      padding: 10pt;
      display: flex;
      flex-direction: column;
      gap: 5pt;
      min-width: 0;
    }
    .kpi { font-size: 34pt; font-weight: 700; line-height: 1; color: #1E293B; }
    .small { font-size: 10pt; line-height: 1.35; }
    .tiny { font-size: 9pt; line-height: 1.3; }
    ul { margin: 0; padding-left: 14pt; }
    li { margin: 0; font-size: 11pt; line-height: 1.35; color: #1E293B; }
    .table-header { background: #1E293B; border-radius: 6pt 6pt 0 0; padding: 6pt 8pt; }
    .table-header p { color: #FFFFFF; font-size: 10pt; font-weight: 700; }
    .row { display: flex; gap: 6pt; }
    .cell { flex: 1; background: #F8FAFC; padding: 6pt; border-radius: 4pt; }
  </style>
</head>
<body><div class="page" style="gap:16pt;">
      <h2>현재 25개 과정 체계는 갖추었지만 AI 반영이 전무하여 즉시 개편이 필요합니다.</h2>
      <div class="grid-2" style="flex:1; align-items:center;">
        <div class="col" style="justify-content:center;">
          <p class="kpi" style="font-size:96pt;">0</p>
          <p style="font-size:16pt; font-weight:700;">AI 관련 과정</p>
          <p class="muted">2026년 운영 예정 25개 훈련과정 기준</p>
        </div>
        <div class="col" style="justify-content:center;">
          <div class="card"><p style="font-weight:700;">문제</p><p>기존 과정은 친환경·ESG·규제 중심으로 설계되어 AI 적용 업무를 다루지 못합니다.</p></div>
          <div class="card"><p style="font-weight:700;">의미</p><p>교육현장과 산업현장의 직무 변화 속도 사이에 구조적 미스매치가 발생했습니다.</p></div>
          <div class="card"><p style="font-weight:700;">결론</p><p>기존 과정을 유지한 채 AI 모듈을 이식하는 체계적 리디자인이 필요합니다.</p></div>
        </div>
      </div>
    </div></body>
</html>
