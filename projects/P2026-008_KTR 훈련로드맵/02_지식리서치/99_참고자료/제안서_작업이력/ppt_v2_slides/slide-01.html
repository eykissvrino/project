<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html { background: #1E293B; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: #1E293B;
      font-family: Arial, Helvetica, sans-serif;
      color: #FFFFFF;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }
    .page { display: flex; flex-direction: column; flex: 1; margin: 24pt 32pt; }
    h1 { margin: 0; font-size: 28pt; line-height: 1.25; color: #FFFFFF; }
    h2 { margin: 0; font-size: 22pt; line-height: 1.25; color: #FFFFFF; }
    h3 { margin: 0; font-size: 16pt; line-height: 1.3; color: #FFFFFF; }
    p { margin: 0; font-size: 12pt; line-height: 1.45; color: #FFFFFF; }
    .muted { color: #94A3B8; }
    .lime { color: #BDFF00; }
    .grid-2 { display: flex; gap: 12pt; }
    .grid-3 { display: flex; gap: 10pt; }
    .grid-4 { display: flex; gap: 8pt; }
    .col { display: flex; flex-direction: column; gap: 8pt; flex: 1; min-width: 0; }
    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 8pt;
      padding: 10pt;
      display: flex;
      flex-direction: column;
      gap: 5pt;
      min-width: 0;
    }
    .kpi { font-size: 34pt; font-weight: 700; line-height: 1; color: #BDFF00; }
    .small { font-size: 10pt; line-height: 1.35; }
    .tiny { font-size: 9pt; line-height: 1.3; }
    ul { margin: 0; padding-left: 14pt; }
    li { margin: 0; font-size: 11pt; line-height: 1.35; color: #FFFFFF; }
    .table-header { background: #1E293B; border-radius: 6pt 6pt 0 0; padding: 6pt 8pt; }
    .table-header p { color: #FFFFFF; font-size: 10pt; font-weight: 700; }
    .row { display: flex; gap: 6pt; }
    .cell { flex: 1; background: rgba(255,255,255,0.06); padding: 6pt; border-radius: 4pt; }
  </style>
</head>
<body><div class="page" style="justify-content:center; align-items:center; gap:18pt; margin:0 56pt;">
      <div style="width:74pt; height:74pt;"></div>
      <h1 style="font-size:31pt; text-align:center;">산업전환 공동훈련센터(KTR) AI 교육과정개발 반영 교육로드맵 체계구축 용역을 통해 KTR의 AI 전환 실행력을 높이겠습니다.</h1>
      <p class="muted" style="font-size:13pt; text-align:center;">시앤피컨설팅 주식회사 · 2026.04</p>
    </div></body>
</html>
